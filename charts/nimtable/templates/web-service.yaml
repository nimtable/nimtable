apiVersion: v1
kind: Service
metadata:
  name: {{ include "nimtable.webName" . }}
  labels:
    {{- include "nimtable.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "nimtable.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
